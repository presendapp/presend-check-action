name: 'Presend Dependency Security Check'
description: 'Flags typosquats and known vulnerabilities in npm and PyPI dependencies, and suspicious maintainer changes on npm. Free.'
author: 'presendapp'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  ecosystem:
    description: 'npm or pypi'
    required: false
    default: 'npm'
  manifest-path:
    description: 'Path to package.json (npm) or requirements.txt (pypi)'
    required: false
    default: ''
  checks:
    description: 'Comma-separated checks to run: typosquat,maintainer,vulnerability. maintainer is npm-only and skipped for pypi.'
    required: false
    default: 'typosquat,maintainer,vulnerability'
  fail-on-issue:
    description: 'Whether to fail the workflow if an issue is found'
    required: false
    default: 'true'
  fail-on-incomplete:
    description: 'Whether to fail the workflow when some checks could not run (rate limit, network). A warning is shown either way.'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Run Presend dependency check
      shell: bash
      env:
        ECOSYSTEM: ${{ inputs.ecosystem }}
        MANIFEST_PATH: ${{ inputs.manifest-path }}
        CHECKS: ${{ inputs.checks }}
        FAIL_ON_ISSUE: ${{ inputs.fail-on-issue }}
        FAIL_ON_INCOMPLETE: ${{ inputs.fail-on-incomplete }}
      run: node ${{ github.action_path }}/check.js
