name: Self-test

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  PRESEND_TEST: '1'  # nos appels de test sont exclus de la mesure d'usage de Presend

jobs:
  test-npm-detects-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create test package.json
        run: |
          echo '{ "name": "test", "dependencies": { "lodash": "^4.17.21" } }' > /tmp/test-package.json
      - id: check
        uses: ./
        with:
          manifest-path: /tmp/test-package.json
        continue-on-error: true
      - name: Verify it was flagged
        run: |
          if [ "${{ steps.check.outcome }}" != "failure" ]; then
            echo "❌ Expected npm mode to flag lodash, but it didn't."
            exit 1
          fi
          echo "✅ npm mode correctly flagged lodash."

  test-npm-clean-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create clean package.json
        run: |
          echo '{ "name": "test", "dependencies": { "is-number": "^7.0.0" } }' > /tmp/clean-package.json
      - uses: ./
        with:
          manifest-path: /tmp/clean-package.json

  test-pypi-detects-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create test requirements.txt
        run: |
          echo 'django==3.2.0' > /tmp/test-requirements.txt
      - id: check
        uses: ./
        with:
          ecosystem: 'pypi'
          manifest-path: /tmp/test-requirements.txt
        continue-on-error: true
      - name: Verify it was flagged
        run: |
          if [ "${{ steps.check.outcome }}" != "failure" ]; then
            echo "❌ Expected pypi mode to flag django==3.2.0, but it didn't."
            exit 1
          fi
          echo "✅ pypi mode correctly flagged django==3.2.0."

  test-npm-safe-version-not-flagged:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create package.json with a safe, current lodash version
        run: |
          echo '{ "name": "test", "dependencies": { "lodash": "4.18.1" } }' > /tmp/safe-lodash.json
      - id: check
        uses: ./
        with:
          manifest-path: /tmp/safe-lodash.json
          checks: vulnerability
        continue-on-error: true
      - name: Verify it was NOT flagged
        run: |
          if [ "${{ steps.check.outcome }}" != "success" ]; then
            echo "❌ Expected lodash@4.18.1 (a safe, current version) to NOT be flagged, but it was."
            exit 1
          fi
          echo "✅ Correctly did not flag a safe, current version -- confirms version-aware filtering works, not just presence-of-lodash."
